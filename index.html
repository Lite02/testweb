<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1 id="greeting">Привет!</h1>
  <p id="info"></p>
  <button id="btn">Нажми меня</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();    // сообщаем Telegram, что приложение загрузилось
    tg.expand();   // раскрываем на всю высоту

    const user = tg.initDataUnsafe.user;
    if (user) {
      document.getElementById('greeting').textContent = 'Привет, ' + user.first_name + '!';
    }
    document.getElementById('info').textContent =
      'Платформа: ' + tg.platform + ', версия API: ' + tg.version;

    document.getElementById('btn').addEventListener('click', () => {
      tg.showAlert('Работает!');
    });
  </script>
</body>
</html>
